<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习任务清单 - 简洁高效的任务管理</title>
  <meta name="description" content="一个简洁美观的学习任务清单应用，帮助你高效管理学习任务。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #fdfbf7;
      --foreground: #4a4036;
      --card: rgba(255, 255, 255, 0.42);
      --primary: #d97706;
      --primary-foreground: #ffffff;
      --muted-foreground: #8c7f70;
      --destructive: #dc2626;
      --radius: 0.625rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fff8e7 0%, #fff1c9 35%, #ffe3a3 70%, #fff8e8 100%);
      background-size: 300% 300%;
      animation: oceanGradient 14s ease-in-out infinite;
      color: var(--foreground);
      min-height: 100vh;
      padding: 3rem 1rem;
      position: relative;
      overflow-x: hidden;
      isolation: isolate;
    }

    /* 动态海浪渐变波纹背景 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      left: -15%;
      width: 130%;
      pointer-events: none;
      z-index: -1;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      filter: blur(2px);
      transform-origin: center bottom;
    }

    body::before {
      bottom: -22vh;
      height: 48vh;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(255, 193, 92, 0.58) 0 22%, transparent 23%),
        linear-gradient(180deg, rgba(255, 219, 139, 0.72), rgba(255, 239, 190, 0.22));
      box-shadow:
        0 -30px 70px rgba(255, 184, 77, 0.18),
        inset 0 22px 35px rgba(255, 255, 255, 0.45);
      animation: waveFront 9s ease-in-out infinite alternate;
    }

    body::after {
      bottom: -30vh;
      height: 54vh;
      background:
        radial-gradient(ellipse at 40% 100%, rgba(255, 238, 182, 0.86) 0 25%, transparent 26%),
        linear-gradient(180deg, rgba(255, 205, 112, 0.34), rgba(255, 247, 218, 0.16));
      box-shadow:
        0 -45px 90px rgba(255, 180, 60, 0.16),
        inset 0 18px 30px rgba(255, 255, 255, 0.35);
      animation: waveBack 12s ease-in-out infinite alternate-reverse;
    }

    .container {
      position: relative;
      z-index: 2;
    }

    @keyframes oceanGradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes waveFront {
      0% { transform: translateX(-4%) translateY(0) rotate(-1deg) scaleX(1.04); }
      50% { transform: translateX(3%) translateY(-18px) rotate(1.2deg) scaleX(1.08); }
      100% { transform: translateX(-2%) translateY(8px) rotate(-0.5deg) scaleX(1.06); }
    }

    @keyframes waveBack {
      0% { transform: translateX(5%) translateY(10px) rotate(1deg) scaleX(1.08); }
      50% { transform: translateX(-4%) translateY(-24px) rotate(-1.4deg) scaleX(1.03); }
      100% { transform: translateX(2%) translateY(4px) rotate(0.7deg) scaleX(1.07); }
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      body::before, body::after { animation: none; }
    }

    .container {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
    }

    .card {
      overflow: hidden;
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background-color: var(--card);
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card-header {
      padding: 2rem 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 1.875rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--foreground);
    }

    h1 img {
      width: 3rem;
      height: 3rem;
      object-fit: contain;
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background-color: rgba(255, 255, 255, 0.85);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--foreground);
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]::placeholder {
      color: var(--muted-foreground);
    }

    input[type="text"]:focus {
      background-color: #ffffff;
      border-color: rgba(217, 119, 6, 0.3);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border: none;
      border-radius: 1rem;
      background-color: var(--primary);
      color: var(--primary-foreground);
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.35);
      transition: all 0.2s;
    }

    .add-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background-color: #b45309;
      box-shadow: 0 14px 30px -5px rgba(217, 119, 6, 0.45);
    }

    .add-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .add-btn svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .task-limit-hint {
      min-height: 1rem;
      margin-top: 0.5rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted-foreground);
    }

    .task-list-container {
      border-top: 1px solid rgba(255, 255, 255, 0.4);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
      text-align: center;
    }

    .empty-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.4);
      margin-bottom: 1rem;
    }

    .empty-icon svg {
      width: 1.75rem;
      height: 1.75rem;
      color: var(--muted-foreground);
    }

    .empty-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--foreground);
    }

    .empty-hint {
      margin-top: 0.25rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      background-color: rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      transition: background-color 0.2s;
      cursor: grab;
    }

    li:hover {
      background-color: rgba(255, 255, 255, 0.4);
    }

    li.dragging {
      opacity: 0.6;
      cursor: grabbing;
    }

    li.drag-over {
      border-top: 2px solid var(--primary);
    }

    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border: none;
      border-radius: 0.375rem;
      background: transparent;
      color: rgba(140, 127, 112, 0.6);
      cursor: grab;
      transition: all 0.2s;
    }

    .drag-handle:hover {
      background-color: rgba(255, 255, 255, 0.4);
      color: var(--muted-foreground);
    }

    .drag-handle svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
      border-radius: 9999px;
      border: 2px solid rgba(140, 127, 112, 0.3);
      background-color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox:hover {
      border-color: rgba(217, 119, 6, 0.5);
    }

    .checkbox.completed {
      border-color: var(--primary);
      background-color: var(--primary);
      color: var(--primary-foreground);
    }

    .checkbox svg {
      width: 0.75rem;
      height: 0.75rem;
    }

    .task-text {
      flex: 1;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--foreground);
      transition: all 0.2s;
    }

    .task-text.completed {
      color: var(--muted-foreground);
      text-decoration: line-through;
    }

    .delete-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: none;
      border-radius: 0.5rem;
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
    }

    li:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background-color: rgba(220, 38, 38, 0.1);
      color: var(--destructive);
    }

    .delete-btn svg {
      width: 1rem;
      height: 1rem;
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background-color: rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
    }

    .progress-wrapper {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 0.75rem;
    }

    .progress-track {
      flex: 1;
      height: 0.375rem;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.5);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background-color: var(--primary);
      transition: width 0.5s;
    }

    .progress-text {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted-foreground);
      white-space: nowrap;
    }

    .clear-btn {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      background: transparent;
      border: none;
      cursor: pointer;
      text-underline-offset: 2px;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      color: var(--destructive);
      text-decoration: underline;
    }

    .note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    @media (min-width: 640px) {
      body {
        padding: 2rem 1rem;
      }

      h1 {
        font-size: 2.25rem;
      }

      h1 img {
        width: 3.5rem;
        height: 3.5rem;
      }
    }
  </style>

<style id="center-dialog-override">
html, body {
  min-height: 100%;
}
body {
  min-height: 100vh !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-sizing: border-box !important;
  margin: 0 !important;
  padding: 24px !important;
}
.task-container, .container, .todo-container, .app, .card, main {
  box-sizing: border-box;
}
</style>


<style id="fireworks-celebration-style">
#celebrationModal{
  position:fixed; inset:0; z-index:99999; display:none;
  align-items:center; justify-content:center;
  background:rgba(8,12,32,.58); backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#celebrationModal.show{display:flex; animation:celebrateFade .35s ease}
@keyframes celebrateFade{from{opacity:0}to{opacity:1}}
.celebration-card{
  position:relative; width:min(520px,88vw); min-height:330px;
  overflow:hidden; border-radius:28px; padding:42px 28px 30px;
  text-align:center; background:rgba(255,255,255,.94);
  box-shadow:0 24px 80px rgba(0,0,0,.28);
}
#fireworksCanvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.celebration-content{position:relative; z-index:2}
.celebration-emoji{font-size:64px; line-height:1; margin-bottom:12px}
.celebration-title{margin:0 0 10px; font-size:32px; font-weight:800;
  background:linear-gradient(90deg,#f6b73c,#ef6b73,#8d72e8,#39a0db);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.celebration-text{margin:0 0 24px; font-size:17px; color:#555}
.celebration-close{
  border:0; border-radius:999px; padding:12px 28px; cursor:pointer;
  font-size:16px; font-weight:700; color:#fff;
  background:linear-gradient(135deg,#f6b73c,#ef7c8e);
  box-shadow:0 8px 20px rgba(239,124,142,.25)
}
</style>




<style id="mouse-ripple-style">
#mouseRippleLayer{
  position:fixed; inset:0; z-index:9998;
  pointer-events:none; overflow:hidden;
}
.mouse-ripple{
  position:absolute;
  width:24px; height:24px;
  margin:-12px 0 0 -12px;
  border-radius:50%;
  transform:scale(.25);
  opacity:.9;
  background:
    radial-gradient(circle,
      rgba(255,255,255,.95) 0%,
      rgba(255,255,255,.68) 12%,
      rgba(255,255,255,.38) 28%,
      rgba(255,255,255,.18) 46%,
      rgba(255,255,255,.07) 62%,
      rgba(255,255,255,0) 76%);
  box-shadow:
    0 0 10px rgba(255,255,255,.48),
    0 0 24px rgba(255,255,255,.22);
  animation:mouseRippleWhite 1.4s cubic-bezier(.12,.62,.22,1) forwards;
}
.mouse-ripple::before,
.mouse-ripple::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.mouse-ripple::before{
  inset:-3px;
  border:1.5px solid rgba(255,255,255,.58);
  box-shadow:
    0 0 8px rgba(255,255,255,.34),
    inset 0 0 8px rgba(255,255,255,.18);
  animation:softRing 1.4s ease-out forwards;
}
.mouse-ripple::after{
  inset:7px;
  border:1px solid rgba(255,255,255,.38);
  box-shadow:0 0 8px rgba(255,255,255,.25);
}
@keyframes mouseRippleWhite{
  0%{
    transform:scale(.25);
    opacity:.9;
  }
  40%{opacity:.55}
  100%{
    transform:scale(8);
    opacity:0;
  }
}
@keyframes softRing{
  0%{transform:scale(.7);opacity:.7}
  100%{transform:scale(1.25);opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .mouse-ripple{animation:none;display:none}
}
</style>



</head>

          <p class="subtitle">good good study!</p>
        </header>

        <div class="input-row">
          <input
            id="taskInput"
            type="text"
            placeholder="添加一个新任务"
            autocomplete="off"
          />
          <button id="addBtn" class="add-btn" disabled aria-label="添加任务">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
        </div>
        <p id="taskLimitHint" class="task-limit-hint" aria-live="polite"></p>
      </div>

      <div class="task-list-container">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
          </div>
          <p class="empty-title">暂无任务</p>
          <p class="empty-hint">在上方输入框添加任务，拖拽可调整优先级顺序</p>
        </div>

        <ul id="taskList" style="display: none;"></ul>
      </div>

      <div id="footerBar" class="footer-bar" style="display: none;">
        <div class="progress-wrapper">
          <div class="progress-track">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
          </div>
          <span id="progressText" class="progress-text">0/0</span>
        </div>
        <button id="clearBtn" class="clear-btn">清除已完成</button>
      </div>
    </div>

    <p class="note">任务会自动保存在浏览器本地</p>
  </main>

  <script>
    const STORAGE_KEY = "todo-tasks";
    const MAX_TASKS = 10;
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const emptyState = document.getElementById("emptyState");
    const footerBar = document.getElementById("footerBar");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const clearBtn = document.getElementById("clearBtn");
    const taskLimitHint = document.getElementById("taskLimitHint");

    let tasks = [];

    function loadTasks() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          tasks = JSON.parse(saved);
          // 即使浏览器中之前保存了超过10个任务，也只保留前10个。
          if (!Array.isArray(tasks)) tasks = [];
          tasks = tasks.slice(0, MAX_TASKS);
        } catch {
          tasks = [];
        }
      }
      render();
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function generateId() {
      return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text || tasks.length >= MAX_TASKS) return;
      tasks.unshift({ id: generateId(), text, completed: false, createdAt: Date.now() });
      taskInput.value = "";
      taskInput.focus();
      saveTasks();
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
      saveTasks();
      render();

      // 任务的勾选按钮是自定义 button，而不是 input[type="checkbox"]。
      // 因此在每次真正勾选/取消勾选后，直接检查当前实际存在的任务。
      const allTasksCompleted =
        tasks.length > 0 && tasks.every((t) => t.completed);

      if (allTasksCompleted) {
        if (!window.__taskCompletionCelebrated &&
            typeof window.showTaskCompletionFireworks === "function") {
          window.__taskCompletionCelebrated = true;
          window.showTaskCompletionFireworks();
        }
      } else {
        // 只要有一个任务被取消完成，下次再次全部完成时允许重新庆祝。
        window.__taskCompletionCelebrated = false;
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      saveTasks();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter((t) => !t.completed);
      saveTasks();
      render();
    }

    function reorderTasks(draggedId, targetId) {
      const draggedIndex = tasks.findIndex((t) => t.id === draggedId);
      const targetIndex = tasks.findIndex((t) => t.id === targetId);
      if (draggedIndex === -1 || targetIndex === -1 || draggedIndex === targetIndex) return;
      const [removed] = tasks.splice(draggedIndex, 1);
      tasks.splice(targetIndex, 0, removed);
      saveTasks();
      render();
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter((t) => t.completed).length;
      const progress = total === 0 ? 0 : (completed / total) * 100;
      progressFill.style.width = `${progress}%`;
      progressText.textContent = `${completed}/${total}`;
      clearBtn.style.display = completed > 0 ? "block" : "none";
    }

    function render() {
      taskInput.disabled = tasks.length >= MAX_TASKS;
      addBtn.disabled = tasks.length >= MAX_TASKS || !taskInput.value.trim();
      taskLimitHint.textContent = tasks.length >= MAX_TASKS
        ? "已达到10个任务上限，完成或删除任务后可继续添加。"
        : `已添加 ${tasks.length}/${MAX_TASKS} 个任务`;

      if (tasks.length === 0) {
        emptyState.style.display = "flex";
        taskList.style.display = "none";
        footerBar.style.display = "none";
        taskList.innerHTML = "";
        return;
      }

      emptyState.style.display = "none";
      taskList.style.display = "block";
      footerBar.style.display = "flex";

      taskList.innerHTML = "";
      tasks.forEach((task) => {
        const li = document.createElement("li");
        li.draggable = true;
        li.dataset.id = task.id;

        li.innerHTML = `
          <button class="drag-handle" aria-label="拖拽排序">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="12" r="1" />
              <circle cx="9" cy="5" r="1" />
              <circle cx="9" cy="19" r="1" />
              <circle cx="15" cy="12" r="1" />
              <circle cx="15" cy="5" r="1" />
              <circle cx="15" cy="19" r="1" />
            </svg>
          </button>
          <button class="checkbox ${task.completed ? "completed" : ""}" aria-label="${task.completed ? "标记为未完成" : "标记为完成"}">
            ${task.completed ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>` : ""}
          </button>
          <span class="task-text ${task.completed ? "completed" : ""}">${escapeHtml(task.text)}</span>
          <button class="delete-btn" aria-label="删除任务">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
            </svg>
          </button>
        `;

        li.querySelector(".checkbox").addEventListener("click", () => toggleTask(task.id));
        li.querySelector(".delete-btn").addEventListener("click", () => deleteTask(task.id));

        li.addEventListener("dragstart", (e) => {
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", task.id);
          li.classList.add("dragging");
        });

        li.addEventListener("dragend", () => {
          li.classList.remove("dragging");
          document.querySelectorAll("li").forEach((item) => item.classList.remove("drag-over"));
        });

        li.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const targetLi = e.currentTarget;
          if (!targetLi.classList.contains("dragging")) {
            targetLi.classList.add("drag-over");
          }
        });

        li.addEventListener("dragleave", (e) => {
          e.currentTarget.classList.remove("drag-over");
        });

        li.addEventListener("drop", (e) => {
          e.preventDefault();
          const draggedId = e.dataTransfer.getData("text/plain");
          const targetId = e.currentTarget.dataset.id;
          e.currentTarget.classList.remove("drag-over");
          if (draggedId && targetId && draggedId !== targetId) {
            reorderTasks(draggedId, targetId);
          }
        });

        taskList.appendChild(li);
      });

      updateProgress();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    taskInput.addEventListener("input", () => {
      addBtn.disabled = !taskInput.value.trim() || tasks.length >= MAX_TASKS;
    });

    taskInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });

    addBtn.addEventListener("click", addTask);
    clearBtn.addEventListener("click", clearCompleted);

    loadTasks();
    // 初始状态下同步“最多10个任务”的按钮状态。
    addBtn.disabled = tasks.length >= MAX_TASKS || !taskInput.value.trim();
  </script>

<div id="celebrationModal" aria-hidden="true">
  <div class="celebration-card">
    <canvas id="fireworksCanvas"></canvas>
    <div class="celebration-content">
      <div class="celebration-emoji">🎉</div>
      <h2 class="celebration-title">全部完成啦！</h2>
      <p class="celebration-text">太棒了！你已经完成了今天的学习任务！</p>
      <button class="celebration-close" id="celebrationClose">继续努力</button>
    </div>
  </div>
</div>

<script id="fireworks-celebration-script">
(function(){
  const modal = document.getElementById('celebrationModal');
  const canvas = document.getElementById('fireworksCanvas');
  const closeBtn = document.getElementById('celebrationClose');
  if(!modal || !canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [], raf = 0, timer = 0;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, rect.width*dpr);
    canvas.height = Math.max(1, rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);

  function burst(x,y){
    const colors=['#ff5f6d','#ffc371','#7bdff2','#b8f2e6','#cdb4db','#fff275'];
    for(let i=0;i<55;i++){
      const a=Math.random()*Math.PI*2, speed=1.2+Math.random()*4.2;
      particles.push({
        x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
        life:1,decay:.012+Math.random()*.012,
        size:1.2+Math.random()*2.2,
        color:colors[(Math.random()*colors.length)|0]
      });
    }
  }
  function launch(){
    const rect=canvas.getBoundingClientRect();
    const x=rect.width*(.15+Math.random()*.7);
    const y=rect.height*(.18+Math.random()*.48);
    burst(x,y);
  }
  function animate(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=.035; p.vx*=.99; p.life-=p.decay;
      if(p.life<=0){particles.splice(i,1);continue}
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(animate);
  }
  function showCelebration(){
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    resize();
    particles=[];
    clearInterval(timer);
    launch(); setTimeout(launch,350); setTimeout(launch,700); setTimeout(launch,1050);
    timer=setInterval(launch,1250);
    cancelAnimationFrame(raf); animate();
  }
  function hideCelebration(){
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    clearInterval(timer); cancelAnimationFrame(raf); particles=[];
    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  }
  closeBtn && closeBtn.addEventListener('click',hideCelebration);
  modal.addEventListener('click',e=>{ if(e.target===modal) hideCelebration(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && modal.classList.contains('show')) hideCelebration(); });

  // Expose a small hook so the existing "all tasks completed" logic can trigger the popup.
  window.showTaskCompletionFireworks = showCelebration;
})();
</script>

<div id="mouseRippleLayer" aria-hidden="true"></div>

<script id="mouse-ripple-script">
(function(){
  const layer = document.getElementById('mouseRippleLayer');
  if(!layer || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let lastX = -9999, lastY = -9999, lastTime = 0;
  const minDistance = 18;
  const minInterval = 65;

  function isInsideTaskBox(x, y){
    // 学习任务主框：检测鼠标当前位置是否落在页面中的主要卡片/容器内。
    const candidates = document.querySelectorAll(
      '.task-container, .container, .todo-container, .app, .card, main'
    );
    for(const el of candidates){
      const r = el.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){
        return true;
      }
    }
    return false;
  }

  function createRipple(x,y){
    const ripple = document.createElement('span');
    ripple.className='mouse-ripple';
    ripple.style.left=x+'px';
    ripple.style.top=y+'px';
    layer.appendChild(ripple);
    ripple.addEventListener('animationend',()=>ripple.remove(),{once:true});
  }

  document.addEventListener('mousemove', function(e){
    // 只在网页背景出现；进入学习任务框后立即停止水波纹。
    if(isInsideTaskBox(e.clientX,e.clientY)){
      lastX = e.clientX;
      lastY = e.clientY;
      return;
    }

    const now=performance.now();
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(now-lastTime < minInterval || Math.hypot(dx,dy) < minDistance) return;

    lastX=e.clientX;
    lastY=e.clientY;
    lastTime=now;
    createRipple(e.clientX,e.clientY);
  });
})();
</script>
